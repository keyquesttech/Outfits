# Outfits network configuration. Installed to /etc/default/outfits.
#
# The app runs inside its own network namespace with its own MAC and LAN IP, so
# it owns port 80 there without touching anything already listening on port 80
# in the host's network stack.

# LAN address for the Outfits app. Must be free and outside the router's DHCP
# pool (or reserved for the macvlan MAC).
OUTFITS_IP=192.168.86.251
OUTFITS_CIDR=24

# Physical interface to hang the macvlan off, and the LAN gateway.
OUTFITS_PARENT=eth0
OUTFITS_GW=192.168.86.1

# Namespace and interface names.
OUTFITS_NS=outfits
OUTFITS_LINK=outfits0

# mDNS name published for the address above.
OUTFITS_HOSTNAME=outfits.local

# DNS servers used from inside the namespace.
OUTFITS_DNS="192.168.86.1 1.1.1.1"
